<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>darkloner_ — blackened</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh}
nav{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a1a1a;padding:16px 24px}
.logo{font-weight:900;letter-spacing:-1px}
.badge{border:1px solid #222;padding:4px 10px;border-radius:20px;color:#666;font-size:12px}
.wrap{padding:24px;max-width:420px;margin:auto}
h1{font-size:54px;font-weight:900;letter-spacing:-4px;line-height:0.9;margin-top:40px}
p.sub{color:#666;margin-top:12px;line-height:1.4}
.card{border:1px solid #1a1a1a;background:#0a0a0a;border-radius:24px;padding:20px;margin-top:24px}
input{width:100%;background:#000;border:1px solid #222;border-radius:12px;padding:14px;color:white;margin-top:12px;outline:none}
button{width:100%;background:white;color:black;border:none;padding:14px;border-radius:12px;font-weight:700;margin-top:14px;cursor:pointer}
button.sec{background:transparent;color:white;border:1px solid #222}
.error{background:#1a0000;border:1px solid #331111;color:#ff4444;padding:10px;border-radius:10px;margin-top:12px;font-size:13px;display:none}
.tabs{display:flex;gap:8px;margin-top:24px}
.tabs div{flex:1;text-align:center;padding:12px;border:1px solid #222;border-radius:12px;cursor:pointer;color:#666}
.tabs div.active{background:white;color:black;border-color:white}
#app{display:none}
#auth{display:block}
.small{font-size:12px;color:#444;margin-top:20px;text-align:center}
</style>
</head>
<body>
<nav><div class="logo">darkloner_</div><div class="badge">blackened • auth</div></nav>

<div id="auth" class="wrap">
<h1>AUTH<br>ONLY.</h1>
<p class="sub">Signup, login. Wrong password = no entry.</p>

<div class="tabs">
<div id="t-login" class="active" onclick="showTab('login')">Login</div>
<div id="t-signup" onclick="showTab('signup')">Sign Up</div>
</div>

<div class="card">
<div id="form-login">
<input id="l-email" placeholder="Email">
<input id="l-pass" type="password" placeholder="Password">
<div id="l-error" class="error"></div>
<button onclick="login()">Login</button>
</div>

<div id="form-signup" style="display:none">
<input id="s-email" placeholder="Email">
<input id="s-pass" type="password" placeholder="Password (min 6)">
<input id="s-pass2" type="password" placeholder="Confirm Password">
<div id="s-error" class="error"></div>
<button onclick="signup()">Create Account</button>
</div>
</div>
<p class="small">Demo auth uses localStorage — secure for MVP, we go add real backend later</p>
</div>

<div id="app" class="wrap">
<h1>DEPLOY<br>ANYTHING.</h1>
<p class="sub">Welcome <span id="userEmail" style="color:white"></span> — you don login.</p>
<div class="card">
<div style="font-size:13px;color:#888">Project name</div>
<input id="proj" placeholder="my-app">
<button onclick="deploy()">Deploy Now</button>
<button class="sec" onclick="logout()">Logout</button>
</div>
</div>

<script>
let tab='login';
function showTab(t){
tab=t;
document.getElementById('t-login').className = t==='login'?'active':'';
document.getElementById('t-signup').className = t==='signup'?'active':'';
document.getElementById('form-login').style.display = t==='login'?'block':'none';
document.getElementById('form-signup').style.display = t==='signup'?'block':'none';
}

function getUsers(){ return JSON.parse(localStorage.getItem('dl_users')||'{}'); }
function saveUsers(u){ localStorage.setItem('dl_users', JSON.stringify(u)); }

function signup(){
let e=document.getElementById('s-email').value.trim().toLowerCase();
let p=document.getElementById('s-pass').value;
let p2=document.getElementById('s-pass2').value;
let err=document.getElementById('s-error');
err.style.display='none';
if(!e||!p){ err.innerText='Fill all fields'; err.style.display='block'; return; }
if(p.length<6){ err.innerText='Password too short — min 6'; err.style.display='block'; return; }
if(p!==p2){ err.innerText='Passwords no match'; err.style.display='block'; return; }
let users=getUsers();
if(users[e]){ err.innerText='User already exists — go login'; err.style.display='block'; return; }
users[e]={password:p, created:Date.now()};
saveUsers(users);
localStorage.setItem('dl_current', e);
enterApp(e);
}

function login(){
let e=document.getElementById('l-email').value.trim().toLowerCase();
let p=document.getElementById('l-pass').value;
let err=document.getElementById('l-error');
err.style.display='none';
let users=getUsers();
if(!users[e]){
err.innerText='No account with that email'; err.style.display='block'; return;
}
if(users[e].password !== p){
err.innerText='Incorrect password — e no go login'; err.style.display='block'; return;
}
localStorage.setItem('dl_current', e);
enterApp(e);
}

function enterApp(email){
document.getElementById('auth').style.display='none';
document.getElementById('app').style.display='block';
document.getElementById('userEmail').innerText=email;
}

function logout(){
localStorage.removeItem('dl_current');
document.getElementById('app').style.display='none';
document.getElementById('auth').style.display='block';
}

function deploy(){
let n=document.getElementById('proj').value||'my-app';
alert('Deploying '+n+'.darkloner.vercel.app for '+localStorage.getItem('dl_current'));
}

// Auto login if session exists
let cur=localStorage.getItem('dl_current');
if(cur && getUsers()[cur]){ enterApp(cur); }
</script>
</body>
</html>
